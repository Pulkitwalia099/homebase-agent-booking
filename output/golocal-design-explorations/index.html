<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoLocal design directions</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#193c32;font:14px/1.6 'Helvetica Neue',Arial,sans-serif}header{max-width:1200px;margin:0 auto;padding:30px 24px 20px;display:flex;justify-content:space-between;gap:30px;align-items:end}h1{font-size:28px;letter-spacing:-1px;margin:0 0 7px;font-weight:500}p{margin:0;color:#6e7c6b;max-width:710px;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1200px;padding:0 24px 22px;margin:auto}button{font:inherit;padding:13px 17px;background:transparent;border:1px solid #c7d3bd;border-radius:6px;cursor:pointer;color:#193c32;text-align:left}button[aria-pressed=true]{background:#193c32;color:#f5f2e9}button span{display:block;font-size:10px;opacity:.7}a{color:#193c32;text-underline-offset:4px;font-size:12px;white-space:nowrap}section.preview{display:block;width:calc(100% - 48px);max-width:1280px;margin:0 auto 24px;border:1px solid #d0dac6;border-radius:8px;background:#f5f2e9}button:focus-visible,a:focus-visible{outline:3px solid #df704b;outline-offset:4px}@media(max-width:700px){header{flex-direction:column;align-items:start;gap:15px;padding-top:20px}h1{font-size:25px}nav{gap:7px}button{flex:1;min-width:100px;font-size:12px;padding:10px}section.preview{width:calc(100% - 24px)}}section.preview img{width:100%;height:auto;display:block;border-radius:8px}section.preview>a{display:block}</style></head><body><header><div><h1>GoLocal, built for personal agents.</h1><p>Three directions. Same palette and positioning. Open a mockup, then click “I’m a personal assistant” to leave the website UI and read the agent files.</p></div><a id="open" href="01-warm-editorial.html" >Open this mockup separately</a></header><nav aria-label="Choose a design"><button data-page="01-warm-editorial.html" aria-pressed="true">A · Warm & spacious<span>Recommended · closest to the earlier site</span></button><button data-page="02-agent-native.html" aria-pressed="false">B · Agent native<span>The connection and product lead</span></button><button data-page="03-local-world.html" aria-pressed="false">C · The local world<span>A calmer, illustration-led story</span></button></nav><section class="preview"><a id="explore" href="01-warm-editorial.html" aria-label="Explore selected mockup"><img id="preview" src="a-desktop.jpg" alt="Warm and spacious GoLocal design"></a></section><script>document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const images={'01-warm-editorial.html':'a-desktop.jpg','02-agent-native.html':'b-desktop.jpg','03-local-world.html':'c-desktop.jpg'};document.getElementById('preview').src=images[b.dataset.page];document.getElementById('preview').alt=b.textContent;document.getElementById('open').href=b.dataset.page;document.getElementById('explore').href=b.dataset.page;}));</script></body></html>
